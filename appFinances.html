<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Financeiro - Ponto Eletrônico</title>
    <!-- Favicon & Mobile App Shortcut Icons -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ponto">
    <meta name="theme-color" content="#0066cc">
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .finance-wrapper {
            flex: 1;
            padding: 0;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(100vh - var(--header-height));
            background: #070b14;
        }
        .finance-iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Notificações -->
    <div id="toast-container" class="toast-container"></div>

    <section id="dashboard-layout" class="view active">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-clock brand-icon-default"></i>
                <img class="brand-logo" src="" style="display:none; height: 32px; border-radius: 4px; margin-right: 10px;">
                <span class="brand">Ponto Eletrônico</span>
                <button id="btn-close-sidebar" class="btn-icon mobile-only"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="details">
                    <span id="sidebar-user-name">Usuário</span>
                    <small id="sidebar-user-role">Cargo</small>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="registrar_ponto.html" class="nav-item"><i class="fa-solid fa-fingerprint"></i> Registrar Ponto</a>
                <a href="relatorios.html" class="nav-item"><i class="fa-solid fa-file-invoice"></i> Meus Relatórios</a>
                <a href="imc.html" class="nav-item"><i class="fa-solid fa-weight-scale"></i> IMC</a>
                <a href="appFinances.html" class="nav-item active"><i class="fa-solid fa-arrow-trend-up"></i> App Financeiro</a>
                <a href="funcionarios.html" class="nav-item admin-only"><i class="fa-solid fa-users"></i> Funcionários</a>
                <a href="admin.html" class="nav-item admin-only"><i class="fa-solid fa-shield-halved"></i> Painel Admin</a>
                <a href="configuracoes.html" class="nav-item"><i class="fa-solid fa-gear"></i> Configurações</a>
                <a href="perfil.html" class="nav-item"><i class="fa-solid fa-user-pen"></i> Perfil</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="btn-logout" class="nav-item text-danger"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="topbar">
                <button id="btn-toggle-sidebar" class="btn-icon"><i class="fa-solid fa-bars"></i></button>
                <div style="font-weight: 600; font-size: 1rem; color: var(--text-color); display: flex; align-items: center; gap: 8px; margin-left: 8px;">
                    <i class="fa-solid fa-arrow-trend-up" style="color: var(--primary-color);"></i>
                    <span>App Financeiro</span>
                </div>
                <div class="topbar-right">
                    <div class="theme-switch-wrapper">
                        <i class="fa-solid fa-sun"></i>
                        <label class="theme-switch" for="checkbox-theme">
                            <input type="checkbox" id="checkbox-theme" />
                            <div class="slider round"></div>
                        </label>
                        <i class="fa-solid fa-moon"></i>
                    </div>
                </div>
            </header>

            <div class="finance-wrapper">
                <iframe id="frame-app-finances" class="finance-iframe" src="appFinances/index.html" title="FC Finanças"></iframe>
            </div>
        </main>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/timeTracker.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
